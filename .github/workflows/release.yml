name: Release from Package

on:
  push:
    branches:
      - main
    paths:
      - "package.json"
      - "plugin.json"
      - "package.zip"
      - "CHANGELOG.md"
      - "README.md"
      - "README_zh_CN.md"
      - ".github/workflows/release.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify package
        shell: bash
        run: |
          test -f package.zip
          unzip -t package.zip
          ls -lh package.zip

      - name: Create tag
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git rev-parse "refs/tags/${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            git tag -a "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.tag }}"
            git push origin "${{ steps.version.outputs.tag }}"
          fi

      - name: Build release notes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import json
          import os
          import re

          version = json.loads(Path("package.json").read_text(encoding="utf-8"))["version"]
          heading = re.compile(rf"^##\s+v?{re.escape(version)}(?:\s+.*)?$", re.M)
          next_heading = re.compile(r"^##\s+v?\d+\.\d+\.\d+(?:\s+.*)?$", re.M)

          body = None
          source = "N/A"
          for path in [Path("CHANGELOG.md"), Path("README_zh_CN.md"), Path("README.md")]:
            if not path.exists():
              continue
            text = path.read_text(encoding="utf-8")
            match = heading.search(text)
            if not match:
              continue
            rest = text[match.start():]
            next_match = next_heading.search(rest, match.end() - match.start())
            body = rest[:next_match.start()].strip() if next_match else rest.strip()
            source = path.name
            break

          if not body:
            body = f"## v{version}"

          body += (
            f"\n\n---\n\n"
            f"Source: {source}\n"
            f"Package: package.zip\n"
            f"Commit: {os.environ.get('GITHUB_SHA', '')}\n"
          )
          Path("release-body.md").write_text(body, encoding="utf-8")
          PY

      - name: Create or update release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          artifacts: package.zip
          artifactErrorsFailBuild: true
          allowUpdates: true
          makeLatest: true
          bodyFile: release-body.md
          token: ${{ secrets.GITHUB_TOKEN }}
